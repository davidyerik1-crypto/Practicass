<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
</head>
<body>
    <h1>CLASS</h1>
    <h2>Utilizando la clase para editar el texto y poner otro en su lugar</h2><br>
    <h3>Usando .getElementById</h3>
    <h4>Ejemplo:</h4>
    <p id="prueba">Uno</p><br>
    <p id="ejemplo">Dos</p>
    <br><br><br>
    <h3>Usando querySelector</h3>
    <h4>Ejemplos:</h4>
    <p class="demo1">Uno</p><br>
    <p class="demo2">Dos</p>

    <script>
        let elemento = document.getElementById("prueba");
        elemento.innerHTML = "Aprendiendo metodos de java script";

        var prueba = document.getElementById("ejemplo");
        prueba.innerHTML = "Soy flojo jajajaja";

        const demo = document.querySelector(".demo1");
        demo.innerHTML = "Probando querySelector";

        const miArray = document.querySelectorAll(".demo2");
        miArray[0].innerHTML = "¡Hola! Sonrie, cada dia es un regalo.";



    </script>
</body>
</html>
